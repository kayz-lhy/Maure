name: CI

on:
  push:
    branches: [master, main, dev, feature/*]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -v ./pkg/...

      - name: Run integration tests
        run: go test -v ./test/...

      - name: Run vet
        run: go vet ./pkg/... ./cmd/...

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: |
          mkdir -p bin
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o bin/maure-darwin-amd64 ./cmd/maure
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/maure-linux-amd64 ./cmd/maure
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/maure-windows-amd64.exe ./cmd/maure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maure-binaries
          path: bin/
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          unformatted_files="$(gofmt -l ./pkg ./cmd ./test)"
          if [ -n "${unformatted_files}" ]; then
            echo "These files are not formatted:"
            echo "${unformatted_files}"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./pkg/... ./cmd/...
